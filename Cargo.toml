[package]
name = "edxlc"
version = "1.14.0"
authors = ["Andrew Smith"]
edition = "2018"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
dirs = "6.0"
hotwatch = "0.5.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-xml-rs = "0.8.0"
libloading = "0.9.0"
winapi = { version = "0.3.9", features = ["winnt"] }
libc = "0.2"
ctrlc = "3.0"
log = "0.4.0"
env_logger = "0.11.0"
toml = "1.0"
glob = "0.3.0"
enum-iterator = "2.0"
winreg = "0.55.0"

[build-dependencies]
embed-resource = "3.0"
